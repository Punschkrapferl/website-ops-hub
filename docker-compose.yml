services:
  api:
    build: ./api
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_PATH: /data/app.db
      CORS_ORIGIN: http://localhost:4567,http://127.0.0.1:4567
    volumes:
      - api_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 2s
      retries: 20

  site-dev:
    build:
      context: ./site
      target: dev
    volumes:
      - ./site:/app
    ports:
      - "4567:4567"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api_data:
