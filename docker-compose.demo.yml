services:
  api:
    image: punschkrapferl23/website-ops-hub-api:v1.0.0
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      NODE_ENV: production
      DB_PATH: /data/app.db
    volumes:
      - api_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 2s
      retries: 20

  site:
    image: punschkrapferl23/website-ops-hub-site:v1.0.1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  api_data:
