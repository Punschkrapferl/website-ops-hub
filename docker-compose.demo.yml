services:
  api:
    image: punschkrapferl23/website-ops-hub-api:1.0.1
    build: ./api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_PATH: /data/app.db
      # CORS not required when demo site proxies same-origin (/api),
      # but keeping localhost:3000 is fine if you ever call API directly.
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - api_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 2s
      retries: 20

  site:
    image: punschkrapferl23/website-ops-hub-site:1.0.1
    build:
      context: ./site
      target: runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  api_data:
