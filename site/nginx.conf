server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Docker DNS (so nginx can resolve "api" reliably)
  resolver 127.0.0.11 ipv6=off valid=10s;

  # API proxy
  location /api/ {

    # Backend routes are /api/... (keep /api)
    # Same-origin proxying avoids CORS in demo mode
    set $upstream http://api:8080;
    proxy_pass $upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backend health passthrough
  location = /health {
    set $upstream http://api:8080;
    proxy_pass $upstream/health;
  }
}
