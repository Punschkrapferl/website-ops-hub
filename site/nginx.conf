server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static site routing (Middleman output: index.html, contact.html, events.html, assets/)
  location / {
    try_files $uri $uri/ =404;
  }

  # Docker DNS (so nginx can resolve "api" reliably)
  resolver 127.0.0.11 ipv6=off valid=10s;

  # API proxy (backend routes are /api/...)
  location /api/ {
    proxy_pass http://api:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backend health passthrough
  location = /health {
    proxy_pass http://api:8080/health;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
